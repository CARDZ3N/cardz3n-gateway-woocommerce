name: Bug report
description: File a bug to help us improve CARDZ3N Gateway for WooCommerce
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do **not** include full PANs, CVVs, or raw NMI Security Keys in this report. Transaction IDs and order IDs are fine.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: "6.5.2"
    validations:
      required: true
  - type: input
    id: woo-version
    attributes:
      label: WooCommerce version
      placeholder: "8.9.0"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.1"
    validations:
      required: true
  - type: dropdown
    id: brand
    attributes:
      label: Brand profile
      options:
        - cardz3n
        - aerospacepay
        - custom (explain in notes)
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: NMI environment
      options:
        - Sandbox
        - Production
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted log excerpt
      description: Paste from WooCommerce → Status → Logs → cardz3n-gateway-*. Redact any PII.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues before opening this.
          required: true
        - label: I have NOT included PANs, CVVs, or full security keys.
          required: true
