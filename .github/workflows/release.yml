name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-zip:
    name: Build and publish release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify version in plugin header
        run: |
          HEADER=$(grep -E "^\s*\*\s*Version:" cardz3n-gateway-woocommerce.php | awk '{print $3}')
          CONST=$(grep "CARDZ3N_GW_VERSION" cardz3n-gateway-woocommerce.php | head -1 | grep -oE "'[0-9.]+'" | tr -d "'")
          STABLE=$(grep -E "^Stable tag:" readme.txt | awk '{print $3}')
          echo "header=$HEADER const=$CONST stable=$STABLE tag=${{ steps.v.outputs.version }}"
          test "$HEADER" = "${{ steps.v.outputs.version }}"
          test "$CONST" = "${{ steps.v.outputs.version }}"
          test "$STABLE" = "${{ steps.v.outputs.version }}"

      - name: Stage plugin folder
        run: |
          # WP.org slug is 'cardz3n-gateway' (the name 'cardz3n-gateway-woocommerce'
          # is reserved because 'woocommerce' is a restricted trademark term).
          mkdir -p build/cardz3n-gateway
          rsync -a \
                --exclude='.git' --exclude='.gitignore' --exclude='.gitattributes' \
                --exclude='.github' --exclude='.DS_Store' --exclude='.editorconfig' \
                --exclude='build' --exclude='tests' --exclude='node_modules' \
                --exclude='phpcs.xml.dist' --exclude='composer.json' --exclude='composer.lock' \
                --exclude='CONTRIBUTING.md' --exclude='CODE_OF_CONDUCT.md' --exclude='SECURITY.md' \
                --exclude='docs/WPORG-SUBMISSION-CHECKLIST.md' \
                ./ build/cardz3n-gateway/
          # Rename the main plugin file to match the slug — WP requires the
          # primary PHP file basename to equal the plugin slug.
          mv build/cardz3n-gateway/cardz3n-gateway-woocommerce.php build/cardz3n-gateway/cardz3n-gateway.php
          # Double-check: remove any stray hidden files the zip would contain.
          find build/cardz3n-gateway -name '.*' -type f -delete
          find build/cardz3n-gateway -name '.*' -type d -exec rm -rf {} +

      - name: Create zip
        run: |
          cd build
          zip -rq cardz3n-gateway-${{ steps.v.outputs.version }}.zip cardz3n-gateway

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/cardz3n-gateway-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
