name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-zip:
    name: Build and publish release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify version in plugin header
        run: |
          HEADER=$(grep -E "^\s*\*\s*Version:" cardz3n-gateway-woocommerce.php | awk '{print $3}')
          CONST=$(grep "CARDZ3N_GW_VERSION" cardz3n-gateway-woocommerce.php | head -1 | grep -oE "'[0-9.]+'" | tr -d "'")
          STABLE=$(grep -E "^Stable tag:" readme.txt | awk '{print $3}')
          echo "header=$HEADER const=$CONST stable=$STABLE tag=${{ steps.v.outputs.version }}"
          test "$HEADER" = "${{ steps.v.outputs.version }}"
          test "$CONST" = "${{ steps.v.outputs.version }}"
          test "$STABLE" = "${{ steps.v.outputs.version }}"

      - name: Stage plugin folder
        run: |
          # WP.org slug is 'cardz3n-gateway' (the name 'cardz3n-gateway-woocommerce'
          # is reserved because 'woocommerce' is a restricted trademark term).
          # The zip folder uses the slug; the MAIN FILE KEEPS ITS NAME
          # (cardz3n-gateway-woocommerce.php), exactly as published on
          # WordPress.org. WordPress tracks an active plugin by its main file
          # path, so renaming it here would silently deactivate the plugin on
          # any site that updates across the two sources.
          # What is excluded comes from .distignore, shared with
          # deploy-wporg.yml, so this zip matches WordPress.org trunk.
          mkdir -p build/cardz3n-gateway
          rsync -a --exclude-from=.distignore ./ build/cardz3n-gateway/
          # Double-check: remove any stray hidden files the zip would contain.
          find build/cardz3n-gateway -name '.*' -type f -delete
          find build/cardz3n-gateway -name '.*' -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Create zip
        run: |
          cd build
          zip -rq cardz3n-gateway-${{ steps.v.outputs.version }}.zip cardz3n-gateway

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/cardz3n-gateway-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
